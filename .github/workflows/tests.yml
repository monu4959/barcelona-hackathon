name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-pipeline.txt
      - name: Install
        run: pip install -r requirements-pipeline.txt pytest==8.3.4
      - name: Run tests
        run: pytest -q
      - name: Score the shipped baselines on the public labels
        run: python evaluation/run_evaluation.py
